      const s = document.createElement('script');

      window.Babel.transformScriptTags();

    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);

ecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg>Call\n    <\u002Fa>\n    <a href=\"#book\" style=\"flex:1.5;height:48px;border-radius:99px;background:#1F4D3A;color:#FAFAF7;display:flex;align-items:center;justify-content:center;font-weight:600;\">Book a visit<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst ICONS = {\n  heart: \"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\",\n  scissors: \"M6 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12\",\n  smile: \"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20ZM8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01\",\n  search: \"M11 3a8 8 0 1 0 0 16 8 8 0 0 0 0-16ZM21 21l-4.35-4.35\",\n  pill: \"m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7ZM8.5 8.5l7 7\",\n  activity: \"M22 12h-4l-3 9L9 3l-3 9H2\",\n};\nconst DAYS = [\"Sunday\",\"Monday\",\"Tuesday\",\"Wednesday\",\"Thursday\",\"Friday\",\"Saturday\"];\nconst EMPTY = { name: \"\", phone: \"\", pet: \"\", species: \"Dog\", reason: \"Wellness exam & vaccines\", notes: \"\" };\n\nclass Component extends DCLogic {\n  state = { w: typeof window !== \"undefined\" ? window.innerWidth : 1280, menu: false, faq: 0, form: { ...EMPTY }, submitted: false, now: new Date() };\n\n  componentDidMount() {\n    this.onResize = () => this.setState({ w: window.innerWidth });\n    window.addEventListener(\"resize\", this.onResize);\n    this.tick = setInterval(() => this.setState({ now: new Date() }), 60000);\n    const els = Array.from(document.querySelectorAll(\"[data-reveal]\"));\n    const vh = window.innerHeight;\n    this.io = new IntersectionObserver((entries) => {\n      entries.forEach((e) => {\n        if (!e.isIntersecting) return;\n        const el = e.target;\n        const delay = (Number(el.dataset.revealIdx) || 0) * 80;\n        el.animate([{ opacity: 0, transform: \"translateY(28px)\" }, { opacity: 1, transform: \"none\" }], { duration: 800, delay, easing: \"cubic-bezier(.2,.8,.2,1)\", fill: \"backwards\" });\n        el.style.opacity = \"\";\n        this.io.unobserve(el);\n      });\n    }, { threshold: 0.12 });\n    let group = null, idx = 0;\n    els.forEach((el) => {\n      if (el.getBoundingClientRect().top < vh) return;\n      if (el.parentElement !== group) { group = el.parentElement; idx = 0; }\n      el.dataset.revealIdx = String(Math.min(idx++, 4));\n      el.style.opacity = \"0\";\n      this.io.observe(el);\n    });\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"resize\", this.onResize);\n    clearInterval(this.tick);\n    this.io && this.io.disconnect();\n  }\n\n  onField = (e) => { const { name, value } = e.target; this.setState((s) => ({ form: { ...s.form, [name]: value } })); };\n  setSpecies = (v) => this.setState((s) => ({ form: { ...s.form, species: v } }));\n  submit = (e) => { e.preventDefault(); this.setState({ submitted: true }); };\n\n  renderVals() {\n    const { w, menu, faq, form, submitted, now } = this.state;\n    const isMobile = w < 1000;\n    const day = now.getDay();\n    const mins = now.getHours() * 60 + now.getMinutes();\n    const weekday = day >= 1 && day <= 5;\n    const openNow = weekday && mins >= 540 && mins < 1020;\n    let statusText, statusShort;\n    if (openNow) { statusText = \"Open today until 5:00 PM\"; statusShort = \"Open now\"; }\n    else if (weekday && mins < 540) { statusText = \"Opens today at 9:00 AM\"; statusShort = \"Opens at 9:00 AM\"; }\n    else { statusText = \"Closed now · Open Mon–Fri, 9:00 AM – 5:00 PM\"; statusShort = \"Closed now\"; }\n\n    const hours = [1,2,3,4,5,6,0].map((d) => {\n      const open = d >= 1 && d <= 5;\n      const today = d === day;\n      return { day: DAYS[d], time: open ? \"9:00 AM – 5:00 PM\" : \"Closed\", bg: today ? \"rgba(157,195,172,0.16)\" : \"transparent\", weight: today ? 600 : 400, color: open ? \"#FAFAF7\" : \"#8FA398\" };\n    });\n\n    const faqData = [\n      { q: \"Are you accepting new patients?\", a: \"Yes. New dogs and cats are always welcome. Call us or send a request and we'll set up a first visit. Bring any previous vaccine or medical records if you have them.\" },\n      { q: \"What animals do you treat?\", a: \"We focus exclusively on dogs and cats. That focus keeps our team sharp on the conditions, surgeries and dental care those pets need most.\" },\n      { q: \"What if my pet is sick today?\", a: \"Call us right away at (703) 592-8599. We make room for same-day sick visits during business hours. After hours, please contact your nearest 24-hour emergency hospital.\" },\n      { q: \"Can I pick up medications and preventives?\", a: \"Yes. Our in-house pharmacy stocks name-brand flea, tick and heartworm preventives plus prescription medications, so you can leave with everything you need.\" },\n      { q: \"Do you offer dental cleanings and surgery?\", a: \"We do. We perform procedures in-house, including spays and neuters, laser surgery, and full dental cleanings under anesthesia.\" },\n    ];\n    const faqs = faqData.map((f, i) => {\n      const open = faq === i;\n      return { ...f, open: String(open), rows: open ? \"1fr\" : \"0fr\", rot: open ? \"45deg\" : \"0deg\", chipBg: open ? \"#1F4D3A\" : \"transparent\", chipFg: open ? \"#FAFAF7\" : \"#13261F\", toggle: () => this.setState({ faq: open ? -1 : i }) };\n    });\n\n    return {\n      isDesktop: !isMobile,\n      isMobile,\n      showMobileMenu: isMobile && menu,\n      toggleMenu: () => this.setState((s) => ({ menu: !s.menu })),\n      closeMenu: () => this.setState({ menu: false }),\n      statusText, statusShort,\n      statusDot: openNow ? \"#3DBE6E\" : \"#E8B04A\",\n      pulseAnim: openNow ? \"pulse 2s infinite\" : \"none\",\n      stats: [\n        { value: \"Since 1987\", label: \"Serving Manassas families\" },\n        { value: \"2 DVMs\", label: \"Who know your pet by name\" },\n        { value: \"Dogs & cats\", label: \"Our exclusive focus\" },\n        { value: \"In-house\", label: \"Surgery, dental & pharmacy\" },\n      ],\n      services: [\n        { n: \"01\", title: \"Wellness & vaccines\", body: \"Annual exams, vaccines and preventive care that catch small issues early.\", icon: ICONS.heart },\n        { n: \"02\", title: \"Surgery & laser surgery\", body: \"Spays, neuters and soft-tissue procedures, with laser options for less pain and faster healing.\", icon: ICONS.scissors },\n        { n: \"03\", title: \"Dental care\", body: \"Cleanings, extractions and oral exams to keep teeth healthy and comfortable.\", icon: ICONS.smile },\n        { n: \"04\", title: \"Diagnostics\", body: \"In-clinic testing so we can find answers quickly and explain them clearly.\", icon: ICONS.search },\n        { n: \"05\", title: \"In-house pharmacy\", body: \"Name-brand flea, tick and heartworm prevention and prescriptions, ready at checkout.\", icon: ICONS.pill },\n        { n: \"06\", title: \"Same-day sick visits\", body: \"Something's not right? Call us. We make room for urgent problems during business hours.\", icon: ICONS.activity },\n      ],\n      reasons: [\n        { n: \"i.\", title: \"The same trusted vets, every visit\", body: \"Two veterinarians with decades at Southside who remember your pet's history, not just their chart.\" },\n        { n: \"ii.\", title: \"Fair, transparent pricing\", body: \"We recommend what your pet actually needs and walk you through costs before we begin.\" },\n        { n: \"iii.\", title: \"Calm, unhurried appointments\", body: \"Time for every question, so you leave informed and confident in the plan.\" },\n      ],\n      vets: [\n        { name: \"Dr. Susan Morrow\", role: \"Veterinarian · Since 2001\", bio: \"Raised in Indiana, Dr. Morrow earned her BS in Animal Science at Purdue University and completed her veterinary degree in 1999. Pet owners know her for thorough, gentle exams.\", slot: \"v2-vet-morrow\", photo: \"./images/dr-morrow.jpg\" },\n        { name: \"Dr. David Powers\", role: \"Veterinarian · 20+ years\", bio: \"A familiar face to generations of local families, Dr. Powers is known for his compassion, practical advice and steady handling of emergencies.\", slot: \"v2-vet-powers\", photo: \"./images/dr-powers.jpg\" },\n      ],\n      reviews: [\n        { quote: \"Dr. Powers has cared for our dogs for years. Compassionate, knowledgeable, and always straight with us.\", name: \"Local pet owner\", initial: \"M\", color: \"#CFE0D4\" },\n        { quote: \"When our cat had an emergency they got us in right away and kept us updated the whole time.\", name: \"Local pet owner\", initial: \"K\", color: \"#E9D9BE\" },\n        { quote: \"Friendly staff, fair prices and thorough care. Exactly the small-town vet we were looking for.\", name: \"Local pet owner\", initial: \"J\", color: \"#D9E3EA\" },\n      ],\n      hours,\n      faqs,\n      form,\n      onField: this.onField,\n      pickDog: () => this.setSpecies(\"Dog\"),\n      pickCat: () => this.setSpecies(\"Cat\"),\n      dogBg: form.species === \"Dog\" ? \"#FFFFFF\" : \"transparent\",\n      catBg: form.species === \"Cat\" ? \"#FFFFFF\" : \"transparent\",\n      dogShadow: form.species === \"Dog\" ? \"0 1px 3px rgba(19,38,31,.18)\" : \"none\",\n      catShadow: form.species === \"Cat\" ? \"0 1px 3px rgba(19,38,31,.18)\" : \"none\",\n      submit: this.submit,\n      submitted,\n      showForm: !submitted,\n      firstName: (form.name || \"\").trim().split(\" \")[0] || \"there\",\n      petLabel: form.pet ? form.pet : `your ${form.species.toLowerCase()}`,\n      resetForm: () => this.setState({ submitted: false, form: { ...EMPTY } }),\n      year: now.getFullYear(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
