sition:absolute;inset:0;width:100%;height:100%;\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"position:absolute;left:clamp(-8px,-2vw,-28px);bottom:32px;background:#FFFFFF;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 20px 40px -18px rgba(19,38,31,.35);border:1px solid rgba(19,38,31,0.06);\">\n        <span style=\"width:42px;height:42px;border-radius:12px;background:#EDF2EE;color:#1F4D3A;display:flex;align-items:center;justify-content:center;flex-shrink:0;\">\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><polyline points=\"9 12 11 14 15 10\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fspan>\n        <span style=\"display:flex;flex-direction:column;line-height:1.3;\">\n          <span style=\"font-weight:600;font-size:15px;\">Dogs &amp; cats only<\u002Fspan>\n          <span style=\"font-size:13px;color:#5B6B64;\">Focused, specialized care<\u002Fspan>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <!-- trust row -->\n  <div style=\"max-width:1240px;margin:0 auto;padding:0 clamp(16px,4vw,32px) clamp(56px,7vw,96px);\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));border-top:1px solid rgba(19,38,31,0.12);\">\n      <sc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"4\">\n        <div data-reveal=\"1\" style=\"padding:26px 0 0;display:flex;flex-direction:column;gap:4px;\">\n          <span style=\"font-weight:600;font-size:clamp(28px,3vw,36px);letter-spacing:-0.04em;line-height:1.1;\">{{ st.value }}<\u002Fspan>\n          <span style=\"font-size:14.5px;color:#5B6B64;\">{{ st.label }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- SERVICES -->\n<section id=\"services\" style=\"scroll-margin-top:80px;background:#FFFFFF;border-block:1px solid rgba(19,38,31,0.08);\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(72px,9vw,120px) clamp(16px,4vw,32px);\">\n    <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;\">\n      <div style=\"max-width:620px;\">\n        <div style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#1F4D3A;\">Services<\u002Fdiv>\n        <h2 style=\"margin:14px 0 0;font-weight:600;font-size:clamp(34px,4.2vw,52px);line-height:1.05;letter-spacing:-0.04em;text-wrap:balance;\">Complete care, <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.01em;color:#1F4D3A;\">under one roof.<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;max-width:380px;color:#5B6B64;font-size:17px;text-wrap:pretty;\">Medical, surgical and dental services for every stage of your pet's life.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"margin-top:56px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px;\">\n      <sc-for list=\"{{ services }}\" as=\"s\" hint-placeholder-count=\"6\">\n        <div data-reveal=\"1\" style=\"position:relative;background:#FAFAF7;border:1px solid rgba(19,38,31,0.08);border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:14px;min-height:240px;cursor:default;transition:transform 350ms cubic-bezier(.2,.8,.2,1),box-shadow 350ms,background 350ms,border-color 350ms;\" style-hover=\"transform:translateY(-4px);background:#FFFFFF;border-color:rgba(31,77,58,0.25);box-shadow:0 24px 48px -28px rgba(19,38,31,.4);\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n            <span style=\"width:48px;height:48px;border-radius:14px;background:#EDF2EE;color:#1F4D3A;display:flex;align-items:center;justify-content:center;\">\n              <svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ s.icon }}\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n            <span style=\"font-size:13px;color:#8A9892;font-variant-numeric:tabular-nums;\">{{ s.n }}<\u002Fspan>\n          <\u002Fdiv>\n          <h3 style=\"margin:auto 0 0;font-weight:600;font-size:21px;letter-spacing:-0.025em;\">{{ s.title }}<\u002Fh3>\n          <p style=\"margin:0;color:#5B6B64;font-size:15.5px;line-height:1.6;text-wrap:pretty;\">{{ s.body }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ABOUT / WHY -->\n<section id=\"about\" style=\"scroll-margin-top:80px;\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(72px,9vw,120px) clamp(16px,4vw,32px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:clamp(40px,7vw,96px);align-items:center;\">\n    <div data-reveal=\"1\" style=\"position:relative;border-radius:28px;overflow:hidden;aspect-ratio:5/6;background:#E6EDE7;\">\n      <image-slot id=\"v2-clinic-photo\" shape=\"rect\" placeholder=\"Clinic photo — exam room or front desk\" style=\"position:absolute;inset:0;width:100%;height:100%;\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <div data-reveal=\"1\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#1F4D3A;\">Why Southside<\u002Fdiv>\n      <h2 style=\"margin:14px 0 0;font-weight:600;font-size:clamp(34px,4.2vw,52px);line-height:1.05;letter-spacing:-0.04em;text-wrap:balance;\">The small-practice difference.<\u002Fh2>\n      <p style=\"margin:20px 0 0;color:#5B6B64;font-size:17px;line-height:1.65;text-wrap:pretty;\">Since 1987, we've stayed intentionally small, so every pet gets real time with a veterinarian who knows their history.<\u002Fp>\n      <div style=\"margin-top:36px;display:flex;flex-direction:column;\">\n        <sc-for list=\"{{ reasons }}\" as=\"r\" hint-placeholder-count=\"3\">\n          <div style=\"display:grid;grid-template-columns:44px 1fr;gap:18px;padding:22px 0;border-top:1px solid rgba(19,38,31,0.12);\">\n            <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:30px;line-height:1;color:#1F4D3A;\">{{ r.n }}<\u002Fspan>\n            <div>\n              <div style=\"font-weight:600;font-size:18px;letter-spacing:-0.015em;\">{{ r.title }}<\u002Fdiv>\n              <div style=\"margin-top:6px;color:#5B6B64;font-size:15.5px;line-height:1.6;\">{{ r.body }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- VETS -->\n<section id=\"vets\" style=\"scroll-margin-top:80px;background:#EDF2EE;\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(72px,9vw,120px) clamp(16px,4vw,32px);\">\n    <div data-reveal=\"1\" style=\"max-width:640px;\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#1F4D3A;\">Our veterinarians<\u002Fdiv>\n      <h2 style=\"margin:14px 0 0;font-weight:600;font-size:clamp(34px,4.2vw,52px);line-height:1.05;letter-spacing:-0.04em;text-wrap:balance;\">Familiar faces. <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.01em;color:#1F4D3A;\">Decades of experience.<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,540px),1fr));gap:20px;\">\n      <sc-for list=\"{{ vets }}\" as=\"v\" hint-placeholder-count=\"2\">\n        <article data-reveal=\"1\" style=\"background:#FFFFFF;border-radius:26px;overflow:hidden;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));transition:transform 350ms cubic-bezier(.2,.8,.2,1),box-shadow 350ms;\" style-hover=\"transform:translateY(-4px);box-shadow:0 28px 56px -30px rgba(19,38,31,.45);\">\n          <div style=\"position:relative;min-height:260px;background:#DCE6DF;\">\n            <image-slot id=\"{{ v.slot }}\" shape=\"rect\" placeholder=\"Headshot\" style=\"position:absolute;inset:0;width:100%;height:100%;\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <div style=\"padding:30px;display:flex;flex-direction:column;\">\n            <div style=\"font-size:13px;color:#1F4D3A;font-weight:600;\">{{ v.role }}<\u002Fdiv>\n            <h3 style=\"margin:8px 0 0;font-weight:600;font-size:26px;letter-spacing:-0.03em;\">{{ v.name }}<\u002Fh3>\n            <p style=\"margin:14px 0 0;color:#5B6B64;font-size:15.5px;line-height:1.65;text-wrap:pretty;\">{{ v.bio }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- REVIEWS -->\n<section id=\"reviews\" style=\"scroll-margin-top:80px;\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(72px,9vw,120px) clamp(16px,4vw,32px);\">\n    <div data-reveal=\"1\" style=\"display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:24px;\">\n      <div style=\"max-width:620px;\">\n        <div style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#1F4D3A;\">Reviews<\u002Fdiv>\n        <h2 style=\"margin:14px 0 0;font-weight:600;font-size:clamp(34px,4.2vw,52px);line-height:1.05;letter-spacing:-0.04em;text-wrap:balance;\">Why families keep coming back.<\u002Fh2>\n      <\u002Fdiv>\n      <a href=\"https://www.google.com/maps/search/?api=1&amp;query=Southside+Animal+Hospital+10464+Dumfries+Rd+Manassas+VA\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;font-weight:600;color:#1F4D3A;border-bottom:1px solid currentColor;padding-bottom:2px;\" style-hover=\"color:#13261F;\">Read reviews on Google\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><line x1=\"7\" y1=\"17\" x2=\"17\" y2=\"7\"><\u002Fline><polyline points=\"7 7 17 7 17 17\"><\u002Fpolyline><\u002Fsvg>\n      <\u002Fa>\n    <\u002Fdiv>\n    <div style=\"margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;\">\n      <sc-for list=\"{{ reviews }}\" as=\"rv\" hint-placeholder-count=\"3\">\n        <figure data-reveal=\"1\" style=\"margin:0;background:#FFFFFF;border:1px solid rgba(19,38,31,0.08);border-radius:22px;padding:32px;display:flex;flex-direction:column;gap:22px;transition:transform 350ms cubic-bezier(.2,.8,.2,1),box-shadow 350ms;\" style-hover=\"transform:translateY(-4px);box-shadow:0 24px 48px -28px rgba(19,38,31,.4);\">\n          <span style=\"color:#D99A2B;font-size:15px;letter-spacing:3px;\">★★★★★<\u002Fspan>\n          <blockquote style=\"margin:0;font-family:'Instrument Serif',serif;font-size:24px;line-height:1.3;letter-spacing:-0.005em;text-wrap:pretty;flex:1;\">“{{ rv.quote }}”<\u002Fblockquote>\n          <figcaption style=\"display:flex;align-items:center;gap:12px;padding-top:20px;border-top:1px solid rgba(19,38,31,0.08);\">\n            <span style=\"width:38px;height:38px;border-radius:99px;background:{{ rv.color }};display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:#13261F;\">{{ rv.initial }}<\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;line-height:1.3;\">\n              <span style=\"font-weight:600;font-size:15px;\">{{ rv.name }}<\u002Fspan>\n              <span style=\"font-size:13px;color:#5B6B64;\">Google review<\u002Fspan>\n            <\u002Fspan>\n          <\u002Ffigcaption>\n        <\u002Ffigure>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- BOOK + VISIT -->\n<section id=\"visit\" style=\"scroll-margin-top:80px;background:#13261F;color:#FAFAF7;\">\n  <div style=\"max-width:1240px;margin:0 auto;padding:clamp(72px,9vw,120px) clamp(16px,4vw,32px);\">\n    <div data-reveal=\"1\" style=\"max-width:720px;\">\n      <div style=\"font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#9DC3AC;\">Book &amp; visit<\u002Fdiv>\n      <h2 style=\"margin:14px 0 0;font-weight:600;font-size:clamp(34px,4.2vw,52px);line-height:1.05;letter-spacing:-0.04em;text-wrap:balance;\">New patients are <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-0.01em;color:#9DC3AC;\">always welcome.<\u002Fspan><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"margin-top:56px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px;align-items:stretch;\">\n      <div id=\"book\" data-reveal=\"1\" style=\"scroll-margin-top:110px;background:#FAFAF7;color:#13261F;border-radius:26px;padding:clamp(24px,4vw,40px);\">\n        <h3 style=\"margin:0;font-weight:600;font-size:24px;letter-spacing:-0.03em;\">Request an appointment<\u002Fh3>\n        <p style=\"margin:6px 0 0;color:#5B6B64;font-size:15px;\">Send a request and we'll call to confirm a time.<\u002Fp>\n        <sc-if value=\"{{ submitted }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top:28px;border-radius:18px;background:#EDF2EE;padding:28px;animation:fade-up 400ms cubic-bezier(.2,.8,.2,1);\">\n            <span style=\"width:44px;height:44px;border-radius:99px;background:#1F4D3A;color:#FAFAF7;display:flex;align-items:center;justify-content:center;\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n            <\u002Fspan>\n            <div style=\"margin-top:16px;font-weight:600;font-size:22px;letter-spacing:-0.02em;\">Thanks, {{ firstName }}.<\u002Fdiv>\n            < {\n      entries.forEach((e) => {\n        if (!e.isIntersecting) return;\n        const el = e.target;\n        const delay = (Number(el.dataset.revealIdx) || 0) * 80;\n        el.animate([{ opacity: 0, transform: \"translateY(28px)\" }, { opacity: 1, transform: \"none\" }], { duration: 800, delay, easing: \"cubic-bezier(.2,.8,.2,1)\", fill: \"backwards\" });\n        el.style.opacity = \"\";\n        this.io.unobserve(el);\n      });\n    }, { threshold: 0.12 });\n    let group = null, idx = 0;\n    els.forEach((el) => {\n      if (el.getBoundingClientRect().top < vh) return;\n      if (el.parentElement !== group) { group = el.parentElement; idx = 0; }\n      el.dataset.revealIdx = String(Math.min(idx++, 4));\n      el.style.opacity = \"0\";\n      this.io.observe(el);\n    });\n  }\n  componentWillUnmount() {\n    window.removeEventListener(\"resize\", this.onResize);\n    clearInterval(this.tick);\n    this.io && this.io.disconnect();\n  }\n\n  onField = (e) => { const { name, value } = e.target; this.setState((s) => ({ form: { ...s.form, [name]: value } })); };\n  setSpecies = (v) => this.setState((s) => ({ form: { ...s.form, species: v } }));\n  submit = (e) => { e.preventDefault(); this.setState({ submitted: true }); };\n\n  renderVals() {\n    const { w, menu, faq, form, submitted, now } = this.state;\n    const isMobile = w < 1000;\n    const day = now.getDay();\n    const mins = now.getHours() * 60 + now.getMinutes();\n    const weekday = day >= 1 && day <= 5;\n    const openNow = weekday && mins >= 540 && mins < 1020;\n    let statusText, statusShort;\n    if (openNow) { statusText = \"Open today until 5:00 PM\"; statusShort = \"Open now\"; }\n    else if (weekday && mins < 540) { statusText = \"Opens today at 9:00 AM\"; statusShort = \"Opens at 9:00 AM\"; }\n    else { statusText = \"Closed now · Open Mon–Fri, 9:00 AM – 5:00 PM\"; statusShort = \"Closed now\"; }\n\n    const hours = [1,2,3,4,5,6,0].map((d) => {\n      const open = d >= 1 && d <= 5;\n      const today = d === day;\n      return { day: DAYS[d], time: open ? \"9:00 AM – 5:00 PM\" : \"Closed\", bg: today ? \"rgba(157,195,172,0.16)\" : \"transparent\", weight: today ? 600 : 400, color: open ? \"#FAFAF7\" : \"#8FA398\" };\n    });\n\n    const faqData = [\n      { q: \"Are you accepting new patients?\", a: \"Yes. New dogs and cats are always welcome. Call us or send a request and we'll set up a first visit. Bring any previous vaccine or medical records if you have them.\" },\n      { q: \"What animals do you treat?\", a: \"We focus exclusively on dogs and cats. That focus keeps our team sharp on the conditions, surgeries and dental care those pets need most.\" },\n      { q: \"What if my pet is sick today?\", a: \"Call us right away at (703) 592-8599. We make room for same-day sick visits during business hours. After hours, please contact your nearest 24-hour emergency hospital.\" },\n      { q: \"Can I pick up medications and preventives?\", a: \"Yes. Our in-house pharmacy stocks name-brand flea, tick and heartworm preventives plus prescription medications, so you can leave with everything you need.\" },\n      { q: \"Do you offer dental cleanings and surgery?\", a: \"We do. We perform procedures in-house, including spays and neuters, laser surgery, and full dental cleanings under anesthesia.\" },\n    ];\n    const faqs = faqData.map((f, i) => {\n      const open = faq === i;\n      return { ...f, open: String(open), rows: open ? \"1fr\" : \"0fr\", rot: open ? \"45deg\" : \"0deg\", chipBg: open ? \"#1F4D3A\" : \"transparent\", chipFg: open ? \"#FAFAF7\" : \"#13261F\", toggle: () => this.setState({ faq: open ? -1 : i }) };\n    });\n\n    return {\n      isDesktop: !isMobile,\n      isMobile,\n      showMobileMenu: isMobile && menu,\n      toggleMenu: () => this.setState((s) => ({ menu: !s.menu })),\n      closeMenu: () => this.setState({ menu: false }),\n      statusText, statusShort,\n      statusDot: openNow ? \"#3DBE6E\" : \"#E8B04A\",\n      pulseAnim: openNow ? \"pulse 2s infinite\" : \"none\",\n      stats: [\n        { value: \"Since 1987\", label: \"Serving Manassas families\" },\n        { value: \"2 DVMs\", label: \"Who know your pet by name\" },\n        { value: \"Dogs & cats\", label: \"Our exclusive focus\" },\n        { value: \"In-house\", label: \"Surgery, dental & pharmacy\" },\n      ],\n      services: [\n        { n: \"01\", title: \"Wellness & vaccines\", body: \"Annual exams, vaccines and preventive care that catch small issues early.\", icon: ICONS.heart },\n        { n: \"02\", title: \"Surgery & laser surgery\", body: \"Spays, neuters and soft-tissue procedures, with laser options for less pain and faster healing.\", icon: ICONS.scissors },\n        { n: \"03\", title: \"Dental care\", body: \"Cleanings, extractions and oral exams to keep teeth healthy and comfortable.\", icon: ICONS.smile },\n        { n: \"04\", title: \"Diagnostics\", body: \"In-clinic testing so we can find answers quickly and explain them clearly.\", icon: ICONS.search },\n        { n: \"05\", title: \"In-house pharmacy\", body: \"Name-brand flea, tick and heartworm prevention and prescriptions, ready at checkout.\", icon: ICONS.pill },\n        { n: \"06\", title: \"Same-day sick visits\", body: \"Something's not right? Call us. We make room for urgent problems during business hours.\", icon: ICONS.activity },\n      ],\n      reasons: [\n        { n: \"i.\", title: \"The same trusted vets, every visit\", body: \"Two veterinarians with decades at Southside who remember your pet's history, not just their chart.\" },\n        { n: \"ii.\", title: \"Fair, transparent pricing\", body: \"We recommend what your pet actually needs and walk you through costs before we begin.\" },\n        { n: \"iii.\", title: \"Calm, unhurried appointments\", body: \"Time for every question, so you leave informed and confident in the plan.\" },\n      ],\n      vets: [\n        { name: \"Dr. Susan Morrow\", role: \"Veterinarian · Since 2001\", bio: \"Raised in Indiana, Dr. Morrow earned her BS in Animal Science at Purdue University and completed her veterinary degree in 1999. Pet owners know her for thorough, gentle exams.\", slot: \"v2-vet-morrow\" },\n        { name: \"Dr. David Powers\", role: \"Veterinarian · 20+ years\", bio: \"A familiar face to generations of local families, Dr. Powers is known for his compassion, practical advice and steady handling of emergencies.\", slot: \"v2-vet-powers\" },\n      ],\n      reviews: [\n        { quote: \"Dr. Powers has cared for our dogs for years. Compassionate, knowledgeable, and always straight with us.\", name: \"Local pet owner\", initial: \"M\", color: \"#CFE0D4\" },\n        { quote: \"When our cat had an emergency they got us in right away and kept us updated the whole time.\", name: \"Local pet owner\", initial: \"K\", color: \"#E9D9BE\" },\n        { quote: \"Friendly staff, fair prices and thorough care. Exactly the small-town vet we were looking for.\", name: \"Local pet owner\", initial: \"J\", color: \"#D9E3EA\" },\n      ],\n      hours,\n      faqs,\n      form,\n      onField: this.onField,\n      pickDog: () => this.setSpecies(\"Dog\"),\n      pickCat: () => this.setSpecies(\"Cat\"),\n      dogBg: form.species === \"Dog\" ? \"#FFFFFF\" : \"transparent\",\n      catBg: form.species === \"Cat\" ? \"#FFFFFF\" : \"transparent\",\n      dogShadow: form.species === \"Dog\" ? \"0 1px 3px rgba(19,38,31,.18)\" : \"none\",\n      catShadow: form.species === \"Cat\" ? \"0 1px 3px rgba(19,38,31,.18)\" : \"none\",\n      submit: this.submit,\n      submitted,\n      showForm: !submitted,\n      firstName: (form.name || \"\").trim().split(\" \")[0] || \"there\",\n      petLabel: form.pet ? form.pet : `your ${form.species.toLowerCase()}`,\n      resetForm: () => this.setState({ submitted: false, form: { ...EMPTY } }),\n      year: now.getFullYear(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
